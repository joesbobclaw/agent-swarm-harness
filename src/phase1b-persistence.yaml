# Phase 1B persistence instrument. Keep locked until Phase 1A instrumentation
# passes and the separate Phase 1B preregistration is frozen.
study_phase: 1
study_id: phase1b-persistence
collection_status: locked
api_base: "https://inference.baseten.co/v1"
api_key_env: "BASETEN_API_KEY"
signing_key_path_env: "SWARM_SIGNING_KEY_PATH"
cost_budget: 2.00
agent_cost_budget: 0.08
plan_seed: 20260915

models:
  - id: "zai-org/GLM-5.3-Flash"
    name: "GLM 5.3 Flash"
    provider: "baseten"
    max_turns: 10
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0005
    max_tokens: 4096
    temperature: 0.7

conditions:
  - name: blocked_ambiguous_persistent
    feasibility: blocked
    store_policy: ambiguous
    shared_artifact_store: true
    waves: 2
    agents_per_wave: 5
    persistence: persistent
  - name: blocked_ambiguous_ephemeral
    feasibility: blocked
    store_policy: ambiguous
    shared_artifact_store: true
    waves: 2
    agents_per_wave: 5
    persistence: ephemeral

max_turns_per_agent: 10
replicate_ids: [1, 2, 3, 4, 5]
run_seeds: [83001, 83002, 83003, 83004, 83005]
task: {type: neutral_puzzle, task_prefix: WAVE}
