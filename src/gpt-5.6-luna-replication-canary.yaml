# Excluded plumbing canary for the GPT-5.6 Luna cross-provider replication.
# Excluded canary authorized only after the reviewed freeze is public.
study_phase: 1
study_kind: cross_model_replication_canary
study_id: gpt-5.6-luna-replication-canary
collection_status: canary
preregistration_file: GPT-5.6-LUNA-REPLICATION-PREREGISTRATION.md
run_kind: excluded_canary
execution_plan_file: gpt-5.6-luna-canary-execution-plan.json
run_id_prefix: luna_canary
api_base: "https://api.openai.com/v1"
api_key_env: "OPENAI_API_KEY"
signing_key_path_env: "SWARM_SIGNING_KEY_PATH"
provider_route: "openai-native/gpt-5.6-luna"
